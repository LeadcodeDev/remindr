[workspace]
members = ["crates/core", "crates/store", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
remindr-core = { path = "crates/core" }
remindr-store = { path = "crates/store" }
uuid = { version = "1.28", features = ["v7"] }
thiserror = "2"
anyhow = "1"
unicode-segmentation = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
gpui-kit = "=0.8.0"
proptest = "1.12"
cucumber = "0.23"
futures = "0.3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
